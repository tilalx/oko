services:
  oko-pipeline:
    build:
      context: .
      target: runtime
    environment:
      ENTSOE_TOKEN: ${ENTSOE_TOKEN:?ENTSOE_TOKEN must be set (see README)}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SQLITE_PATH: /output/oko.sqlite3
    volumes:
      - ../oko-dataset:/output:z,U
      - oko-data:/app/data
    command: ["oko.pipeline", "--export", "/output/forecast_de.json"]

  test:
    build:
      context: .
      target: test
    profiles: ["ci"]

  lint:
    build:
      context: .
      target: lint
    profiles: ["ci"]

  # Local test of the FastAPI query layer (web UI + evcc endpoint). Reads
  # ../oko-dataset/forecast_de.json + oko.sqlite3 live -- run oko-pipeline
  # (or `python -m oko.mockdata --out ../oko-dataset/forecast_de.json`
  # for local dev) first so those files actually exist, then:
  #   docker compose --profile serve build serve
  #   docker compose --profile serve up serve
  serve:
    build:
      context: .
      target: serve
    ports:
      - "8090:8000"
    environment:
      SQLITE_PATH: /output/oko.sqlite3
    volumes:
      - ../oko-dataset:/output:ro,z
    profiles: ["serve"]

volumes:
  oko-data:
