[project]
name = "oko"
version = "0.1.0"
description = "Self-hosted, open-source hourly CO2 intensity forecast for Germany (5-day horizon)."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.14"
authors = [{ name = "OKO contributors" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "structlog>=24.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.0",
    "xmltodict>=1.0.4",
    "eccodes>=2.48",
    "eccodeslib>=2.48.0.26",
]

[project.optional-dependencies]
api = ["fastapi>=0.141.1", "uvicorn>=0.30", "limits>=5.8.0"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "respx>=0.21",
    "ruff>=0.16.5",
    "mypy>=1.10",
    "pandas-stubs>=3.0.5.260730",
    "types-xmltodict>=1.0.1.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oko"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "C4",            # flake8-comprehensions
    "SIM",           # flake8-simplify
    "RUF",           # ruff-specific
    "N",             # pep8-naming
    "D",             # pydocstyle
]
ignore = [
    "D203", # conflicts with D211
    "D213", # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["lightgbm.*", "xmltodict.*", "eccodes.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "oko.fetchers.noaa_gfs"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=oko --cov-report=term-missing"

[tool.coverage.run]
source = ["src/oko"]
